      - generic [ref=f98e60]: 抽屉（Drawer）是一种从屏幕边缘滑入的侧边面板，通常从右侧或左侧进入，并覆盖在 部分内容之上。它用于在不离开当前页面的前提下，承载导航、筛选、操作项或设置等 次级内容；与模态框不同，抽屉的宽面板更适合容纳列表式内容，用户在关闭前仍能保留 当前页面的语境。
