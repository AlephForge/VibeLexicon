          - status
      - generic [ref=f98e98]: 请在页面右侧实现一个 Drawer 抽屉面板： - 结构位置：面板从视口右缘滑入，宽度约 320px，遮罩覆盖其余区域；触发按钮位于页面右上角。 - 行为：打开时面板带遮罩滑入，关闭时反向滑出；点击遮罩、按 Esc 或点击关闭按钮均可关闭；打开期间锁定背景滚动。 - Desktop / Mobile 差异：桌面端可叠加在内容之上；窄屏下可占满约 85% 宽度，避免完全遮住上下文。 - 可访问性：面板使用 role="dialog" 与 aria-modal="true"，初始焦点移入面板，焦点限制在面板内，关闭后焦点归还触发按钮。 - 易错点：不要忘记背景滚动锁定与焦点陷阱；动画时长 220–280ms 且尊重 prefers-reduced-motion；内容过多时面板内部需可滚动。
