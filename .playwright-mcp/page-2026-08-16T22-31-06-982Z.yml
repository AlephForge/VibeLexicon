                    - paragraph [ref=f99e70]: 卡片式布局（Card-based Layout）以卡片作为基本内容容器，将标题、摘要、图片与操作分组 到一个个边界清晰的矩形单元中，再以网格形式排列。它让长短不一的内容获得统一的视觉 节奏，用户可以通过扫读快速定位感兴趣的信息，也适合在有限的区域内承载大量同质条目， 是现代信息密集型界面的常见骨架。
