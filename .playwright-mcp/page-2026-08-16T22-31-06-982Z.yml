                    - paragraph [ref=f99e2287]: 命令面板（Command Palette）是一个输入框包裹的快速操作浮层，通常通过快捷键 （如 Ctrl/Cmd + K）唤起，用户在键入时触发对命令、页面、设置项或搜索结果的 实时过滤，用方向键选择后回车执行。它把分散在菜单、设置和页面导航里的常用操作 收敛到一个统一入口，是桌面工具（如代码编辑器、笔记应用）中效率模式的典型代表。
