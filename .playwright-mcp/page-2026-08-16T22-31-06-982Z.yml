                - generic [ref=f99e136]:
                  - generic [ref=f99e137]:
                    - heading "是什么" [level=3] [ref=f99e138]
                    - paragraph [ref=f99e139]: 瀑布流（Masonry Layout）是一种按列堆叠的网格布局：各列自上而下连续摆放内容块，块的 高度可以各不相同，新块总是被放进当前最短的列中，从而填满底部空隙。它让大量尺寸不一 的媒体以紧凑、错落的节奏呈现，在相册、灵感板与新闻流中最为常见，也让浏览长页面的 整个过程保持较高的内容密度。
