# VibeLexicon Deploy — GitHub Pages (GitHub Issue #16)
#
# On main branch push (or manual dispatch):
#   1. Build static site (validate → production build incl. Pagefind index)
#   2. Configure GitHub Pages and upload dist as Pages artifact
#   3. Deploy the artifact with an OIDC-bound action (id-token: write)
#
# First-time setup: Settings → Pages → Source → "GitHub Actions" (outside-org,
# one-time manual step; afterwards every main push deploys automatically).
# Deployed site: https://alephforge.github.io/VibeLexicon/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; never cancel the one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Content validation (full mode)
        run: pnpm validate

      - name: Production build (incl. Pagefind index)
        run: pnpm build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5